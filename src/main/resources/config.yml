# NoseWeapons runtime feature toggles. Each can be flipped at runtime with
# /nosetoggle <feature> [on|off]. Changes there are written back to this file
# so server restarts preserve the toggles.
features:
  crafting: true
  abilities: true
  passives: true
  particles: true
  shearing: true

# Per-weapon cooldown overrides (seconds). Managed at runtime with
# /nosecooldown <type> <seconds|reset>. Remove or set to null to fall back
# to the hard-coded default for that nose. For the Booger Sniper this value
# is the max-charge cooldown; lower charge levels scale proportionally.
cooldowns: {}
